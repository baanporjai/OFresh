<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>O'Fresh — สถิติสดจากตู้งานลำไย</title>
<link rel="icon" href="/favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B00;
    --orange-dark: #E85D00;
    --green: #339933;
    --off-white: #FFF8F0;
    --text-dark: #2D2D2D;
    --text-muted: #6B7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: 'Prompt', sans-serif;
    color: var(--text-dark);
    background: linear-gradient(160deg, #FFF8F0 0%, #FFEEDD 100%);
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 5vh 5vw; text-align: center;
    gap: clamp(24px, 4vh, 48px);
  }

  .live-tag {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(51,153,51,.1); color: var(--green);
    padding: 8px 20px; border-radius: 50px;
    font-size: clamp(13px, 1.6vw, 17px); font-weight: 700;
    letter-spacing: .3px;
  }
  .live-tag-logo { height: clamp(16px, 2.4vw, 22px); width: auto; object-fit: contain; }
  .live-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  .stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: clamp(16px, 3vw, 32px);
    width: 100%; max-width: 900px;
  }
  .stat-card {
    background: #fff; border-radius: 28px;
    padding: clamp(24px, 4vh, 44px) clamp(16px, 3vw, 32px);
    box-shadow: 0 16px 50px rgba(0,0,0,.07);
    border: 1px solid rgba(255,107,0,.08);
  }
  .stat-icon { font-size: clamp(32px, 5vw, 48px); margin-bottom: 10px; }
  .stat-icon img { height: clamp(56px, 9vw, 88px); width: auto; display: block; margin: 0 auto; }
  .stat-value {
    font-size: clamp(36px, 7vw, 72px); font-weight: 800; color: var(--orange);
    line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  #peakHourValue { font-size: clamp(24px, 4.5vw, 46px); white-space: nowrap; }
  .stat-label { font-size: clamp(16px, 2.4vw, 24px); font-weight: 700; margin-top: 10px; }
  .stat-sub { font-size: clamp(12px, 1.6vw, 16px); color: var(--text-muted); margin-top: 4px; font-weight: 300; }

  .updated-at { font-size: clamp(11px, 1.4vw, 14px); color: var(--text-muted); opacity: .7; }

  .offline-note {
    font-size: clamp(11px, 1.4vw, 14px); color: #b91c1c; opacity: 0; transition: opacity .3s;
  }
  .offline-note.show { opacity: 1; }

  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; max-width: 360px; }
  }

  .heatmap-card {
    background: #fff; border-radius: 28px;
    padding: clamp(20px, 3.5vh, 36px) clamp(16px, 3vw, 32px);
    box-shadow: 0 16px 50px rgba(0,0,0,.07);
    border: 1px solid rgba(255,107,0,.08);
    width: 100%; max-width: 900px;
  }
  .heatmap-header {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    flex-wrap: wrap; margin-bottom: 18px;
  }
  .heatmap-title { font-size: clamp(15px, 2vw, 19px); font-weight: 700; }
  .heatmap-month-select {
    font-family: 'Prompt', sans-serif; font-size: clamp(12px, 1.6vw, 15px); font-weight: 600;
    color: var(--text-dark); background: #F5F5F5; border: none; border-radius: 999px;
    padding: 7px 14px; cursor: pointer;
  }
  .heatmap-badge {
    background: rgba(255,107,0,.1); color: var(--orange-dark);
    padding: 5px 14px; border-radius: 999px; font-size: clamp(12px, 1.6vw, 15px); font-weight: 700;
  }
  .hour-grid { display: grid; grid-template-columns: repeat(12,1fr); gap: 5px; }
  @media (max-width: 600px) { .hour-grid { grid-template-columns: repeat(6,1fr); } }
  .hour-cell {
    aspect-ratio: 1; border-radius: 8px; background: #F5F5F5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .hour-cell .hc-count { font-size: clamp(.6rem, 1.4vw, .82rem); font-weight: 700; color: var(--text-dark); line-height: 1; }
  .hour-cell .hc-lbl { font-size: clamp(.45rem, 1vw, .58rem); color: var(--text-muted); margin-top: 2px; }
  .hour-cell.p1 { background: var(--orange); box-shadow: 0 0 12px rgba(255,107,0,.3); }
  .hour-cell.p1 .hc-count, .hour-cell.p1 .hc-lbl { color: #fff; }
  .hour-cell.p2 { background: #FFB870; }
  .hour-cell.p2 .hc-count, .hour-cell.p2 .hc-lbl { color: #fff; }
  .hour-cell.p3 { background: #FFD7A8; }
  .heatmap-legend { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: clamp(11px, 1.4vw, 13px); color: var(--text-muted); }
  .legend-scale { display: flex; gap: 4px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 4px; }
</style>
</head>
<body>

  <div class="live-tag">
    <img class="live-tag-logo" src="/OFresh_Logo_transparent.png" alt="O'Fresh">
    <span class="live-dot"></span>
    <span>ข้อมูลอัปเดตแบบวันต่อวันจากตู้ในงานลำไย</span>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon"><img src="/assets/cup.png" alt="cup"></div>
      <div class="stat-value" id="cupsValue">—</div>
      <div class="stat-label">แก้วที่เสิร์ฟไปแล้ว</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⏰</div>
      <div class="stat-value" id="peakHourValue">—</div>
      <div class="stat-label">ชั่วโมงยอดนิยม</div>
    </div>
  </div>

  <div class="heatmap-card">
    <div class="heatmap-header">
      <div class="heatmap-title">🌡️ ช่วงเวลาที่ลูกค้าสั่งมากที่สุด</div>
      <select class="heatmap-month-select" id="heatmapMonthSelect" onchange="onHeatmapMonthChange(this.value)"></select>
      <div class="heatmap-badge" id="heatmapBadge">—</div>
    </div>
    <div class="hour-grid" id="hourGrid"></div>
    <div class="heatmap-legend">
      <div class="legend-scale">
        <div class="legend-dot" style="background:#F5F5F5"></div>
        <div class="legend-dot" style="background:#FFD7A8"></div>
        <div class="legend-dot" style="background:#FFB870"></div>
        <div class="legend-dot" style="background:var(--orange)"></div>
      </div>
      <span>น้อย → มาก</span>
    </div>
  </div>

  <div>
    <div class="updated-at" id="updatedAt">กำลังโหลด...</div>
    <div class="offline-note" id="offlineNote">เชื่อมต่อไม่สำเร็จ — แสดงค่าล่าสุดที่มี</div>
  </div>

<script>
const API_BASE = 'https://fancy-dust-060c.yai-taweewoot.workers.dev';
const MACHINE = 'OFresh_Lamyai'; // จำกัด "ชั่วโมงยอดนิยม" ให้เฉพาะตู้นี้ (แก้วรวมยังเป็นยอดทุกตู้เหมือนเดิม)
const REFRESH_MS = 2 * 60 * 1000; // เผื่อไว้ต่ำกว่า cache ฝั่ง Worker (5 นาที) พอให้จอที่เปิดค้างไว้เห็นเลขใหม่ไม่ช้าเกินไป

let lastCups = null, lastPeakHour = null;
let monthOverride = null; // "YYYY-M" ที่ผู้ใช้เลือกเอง — null = ให้ Worker ใช้เดือนปัจจุบันเป็นค่าเริ่มต้น

function renderMonthOptions(availableMonths, selectedMonth) {
  const sel = document.getElementById('heatmapMonthSelect');
  const keepValue = sel.options.length ? sel.value : (selectedMonth ? `${selectedMonth.year}-${selectedMonth.month}` : '');
  sel.innerHTML = (availableMonths || []).map(({ year, month }) => {
    const value = `${year}-${month}`;
    const label = new Date(year, month, 1).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
    return `<option value="${value}">${label}</option>`;
  }).join('');
  const stillExists = Array.from(sel.options).some(o => o.value === keepValue);
  sel.value = stillExists ? keepValue : (selectedMonth ? `${selectedMonth.year}-${selectedMonth.month}` : '');
}

function onHeatmapMonthChange(value) {
  monthOverride = value;
  loadStats();
}

function renderHourGrid(hourCounts) {
  if (!Array.isArray(hourCounts)) return;
  const maxH = Math.max(...hourCounts);
  document.getElementById('hourGrid').innerHTML = hourCounts.map((cnt, h) => {
    const p = maxH > 0 ? cnt / maxH : 0;
    const cls = p >= .85 ? 'p1' : p >= .55 ? 'p2' : p >= .25 ? 'p3' : '';
    return `<div class="hour-cell ${cls}">
      <div class="hc-count">${cnt || ''}</div>
      <div class="hc-lbl">${h}:00</div>
    </div>`;
  }).join('');
}

// นับเลขวิ่งขึ้นแบบ ease-out เหมือนหน้า stats.html แอดมิน ให้ดูมีชีวิตชีวาเวลาเลขเปลี่ยน
function animateNum(el, from, to) {
  const steps = 30, duration = 900, interval = duration / steps;
  let step = 0;
  const tick = () => {
    step++;
    const p = Math.min(step / steps, 1), ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * ease).toLocaleString();
    if (p < 1) setTimeout(tick, interval);
  };
  tick();
}

async function loadStats() {
  const offlineNote = document.getElementById('offlineNote');
  try {
    const monthQuery = monthOverride ? '&month=' + encodeURIComponent(monthOverride) : '';
    const res = await fetch(API_BASE + '/api/public/highlights?machine=' + encodeURIComponent(MACHINE) + '&cupsScope=machine' + monthQuery, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad status');
    const data = await res.json();

    if (typeof data.totalCups === 'number') {
      animateNum(document.getElementById('cupsValue'), lastCups ?? data.totalCups, data.totalCups);
      lastCups = data.totalCups;
    }
    document.getElementById('peakHourValue').textContent =
      typeof data.peakHour === 'number' ? `${data.peakHour}:00-${(data.peakHour + 1) % 24}:00` : '—';
    document.getElementById('heatmapBadge').textContent =
      typeof data.peakHour === 'number' ? `🔥 ยอดฮิต ${data.peakHour}:00–${(data.peakHour + 1) % 24}:00` : 'ยังไม่มีข้อมูล';
    lastPeakHour = data.peakHour;

    renderMonthOptions(data.availableMonths, data.selectedMonth);
    renderHourGrid(data.hourCounts);

    document.getElementById('updatedAt').textContent = data.lastSaleAt
      ? 'ข้อมูลอัพเดทล่าสุด ' + new Date(data.lastSaleAt).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })
      : 'ยังไม่มีข้อมูลแก้วของตู้นี้';
    offlineNote.classList.remove('show');
  } catch (e) {
    // จอนี้ถูกเปิดค้างไว้ที่หน้าตู้ตลอดเวลา — พังทั้งจอไม่ได้ แค่เตือนเบาๆ แล้วคงค่าล่าสุดที่เคยโหลดได้ไว้
    offlineNote.classList.add('show');
  }
}

loadStats();
setInterval(loadStats, REFRESH_MS);
</script>
</body>
</html>
