<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สติ๊กเกอร์ Call Center — O'Fresh</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B00;
    --orange-dark: #E55A00;
    --orange-light: #FF9A3C;
    --dark: #1A1A2E;
    --off-white: #FFF8F0;
    --line-green: #06C755;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Prompt', sans-serif;
    background: #E9E4DC;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* ===== STICKER CARD — 100mm x 140mm, real print size ===== */
  .sticker {
    width: 100mm;
    background: var(--off-white);
    border-radius: 6mm;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ── Top zone: brand + phone (the one thing you read from 2 meters away) ── */
  .top {
    background: var(--dark);
    color: #fff;
    padding: 7mm 6mm;
    text-align: center;
    position: relative;
  }
  .brand { margin-bottom: 3mm; }
  .brand img { height: 15mm; width: auto; display: block; margin: 0 auto; }
  .eyebrow {
    font-size: 3.6mm; font-weight: 500; color: rgba(255,255,255,.55);
    margin-bottom: 2mm;
  }
  .phone-label {
    font-size: 3.4mm; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--orange-light); margin-bottom: 1.5mm;
  }
  .phone-number {
    font-size: 9.5mm; font-weight: 900; line-height: 1;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
  }

  /* ── Bottom zone: LINE + website, quieter, self-serve ── */
  .bottom {
    flex: 1;
    padding: 8mm 7mm 7mm;
    display: flex;
    flex-direction: column;
    gap: 6mm;
  }
  .line-row {
    display: flex; align-items: center; gap: 4mm;
    background: rgba(6,199,85,.07);
    border: 1px solid rgba(6,199,85,.25);
    border-radius: 4mm;
    padding: 4mm;
  }
  .qr-box {
    width: 22mm; height: 22mm; flex-shrink: 0;
    background: #fff; border-radius: 2mm;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border: 1px solid rgba(26,26,46,.08);
  }
  .qr-box img { width: 100%; height: 100%; display: block; }
  .line-info { text-align: left; }
  .line-info .k {
    display: inline-flex; align-items: center; gap: 1.5mm;
    font-size: 3.2mm; font-weight: 700; color: var(--line-green);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 1.5mm;
  }
  .line-info .k svg { width: 4mm; height: 4mm; }
  .line-info .v { font-size: 5.2mm; font-weight: 800; color: var(--dark); line-height: 1.15; }
  .line-info .sub { font-size: 3mm; color: #6B7280; margin-top: 1mm; }

  .divider { height: 1px; background: rgba(26,26,46,.1); }

  .web-row {
    display: flex; align-items: center; gap: 4mm;
    background: rgba(255,107,0,.06);
    border: 1px solid rgba(255,107,0,.2);
    border-radius: 4mm;
    padding: 4mm;
  }
  .web-text { text-align: left; min-width: 0; }
  .web-text .k {
    display: inline-flex; align-items: center; gap: 1.5mm;
    font-size: 3.2mm; font-weight: 700; color: var(--orange);
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 1.5mm;
  }
  .web-text .k svg { width: 4mm; height: 4mm; }
  .web-text .v { font-size: 4mm; font-weight: 800; color: var(--dark); line-height: 1.25; word-break: break-all; }

  .footer-note {
    margin-top: auto;
    text-align: center;
    font-size: 2.8mm; color: #9CA3AF; font-weight: 500;
    padding-top: 3mm;
  }
  .footer-note b { color: var(--orange); }

  /* ===== Screen-only preview chrome ===== */
  .preview-label {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    font-family: 'Prompt', sans-serif; font-size: 13px; color: #6B7280;
    background: #fff; padding: 6px 14px; border-radius: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }

  @media print {
    body { background: #fff; padding: 0; display: block; }
    .preview-label { display: none; }
    .sticker { box-shadow: none; margin: 0; }
    @page { size: 100mm 155mm; margin: 0; }
  }
</style>
</head>
<body>

<div class="preview-label">ขนาดจริง 100mm × 155mm — พิมพ์ด้วย Ctrl/Cmd+P</div>

<div class="sticker">
  <div class="top">
    <div class="brand"><img src="OFresh_Logo_transparent.png" alt="O'Fresh"></div>
    <div class="eyebrow">มีปัญหาหรือคำถาม?</div>
    <div class="phone-label">โทรหาเราได้เลย</div>
    <div class="phone-number">087-986-7000</div>
  </div>

  <div class="bottom">
    <div class="line-row">
      <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=https://lin.ee/Xp47yqZ" alt="QR เพิ่มเพื่อน LINE @ofresh">
      </div>
      <div class="line-info">
        <div class="k">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 5.6 2 10c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.6 1.1-.5 6-3.5 8.2-6C21.6 12.7 22 11.4 22 10c0-4.4-4.5-8-10-8z"/></svg>
          Line official
        </div>
        <div class="v">@ofresh</div>
        <div class="sub">สแกนเพื่อแอดไลน์ทันที</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="web-row">
      <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=https://ofresh.baanporjai.com" alt="QR เว็บไซต์ ofresh.baanporjai.com">
      </div>
      <div class="web-text">
        <div class="k">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
          เว็บไซต์
        </div>
        <div class="v">ofresh.baanporjai.com</div>
      </div>
    </div>

    <div class="footer-note">ส้มแมนดารินคั้นสด <b>100%</b> ทุกแก้ว</div>
  </div>
</div>

</body>
</html>
